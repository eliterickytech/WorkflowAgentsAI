enrichment:
  enabled: true
  scope:
    sprint: "{sprint}"
    activity: "{activity}"
  sources:
    - path: "docs/**/*.md"
    - path: "data/out/sprint{sprint}/{activity}/**/*.md"
    - path: "agents/manual/*.agent.md"
  retrieval:
    topK: 8
    rerank: true
    filters:
      role: ["product-owner","requirements-analyst","systems-architect","testing-specialist","expert-developer","testing-validator","code-reviewer"]
  inject:
    as: "developer"
    position: "after-system"
    header: "----- CONTEXTO ENRIQUECIDO (somente referência) -----"
  constraints:
    maxTokens: 1800
    allowOverridePolicies: false
