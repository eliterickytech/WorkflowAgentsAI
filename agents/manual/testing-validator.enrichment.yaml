enrichment:
  enabled: true
  scope:
    sprint: "{sprint}"
    activity: "{activity}"
  sources:
    - path: "docs/**/*.md"
    - path: "data/out/sprint{sprint}/{activity}/**/*.md"
    - path: "data/out/evidence/**/*.md"
  retrieval:
    topK: 10
    rerank: true
    filters:
      role: ["testing-specialist","expert-developer","testing-validator"]
  inject:
    as: "developer"
    position: "after-system"
    header: "----- CONTEXTO ENRIQUECIDO (somente referência) -----"
  constraints:
    maxTokens: 1800
    allowOverridePolicies: false
