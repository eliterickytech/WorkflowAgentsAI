enrichment:
  enabled: true
  scope:
    sprint: "{sprint}"
    activity: "{activity}"
  sources:
    - path: "docs/**/*.md"
    - path: "data/out/sprint{sprint}/{activity}/**/*.md"
    - path: "data/out/evidence/**/*.md"
  retrieval:
    topK: 8
    rerank: true
    filters:
      role: ["product-owner","product-owner-final","testing-validator"]
  inject:
    as: "developer"
    position: "after-system"
    header: "----- CONTEXTO ENRIQUECIDO (somente referência) -----"
  constraints:
    maxTokens: 1600
    allowOverridePolicies: false
